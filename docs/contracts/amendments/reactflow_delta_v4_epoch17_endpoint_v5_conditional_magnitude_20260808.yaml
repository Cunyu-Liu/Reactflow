amendment_summary: 'Route B (user explicit grant, epoch 17). Finalization of the conditional-magnitude
  learnability gate under endpoint_v5. After the P2 primary (binary-changer publication-macro
  AUPRC) was adjudicated STOP (fail-closed, epoch 16, frozen), the scientific adjudication
  focus moved to the INDEPENDENT conditional-magnitude estimand (contract §4.2 conditional
  row; §9.2 conditional head): for caller_v3-adjudicated TRUE CHANGERS (C_i=1), predict
  profile-level |delta_r| magnitude; metric = conditional WMAE skill vs the train-fold
  weighted-mean trivial baseline, with paired publication-block bootstrap CI. RESULT:
  deepsets mean skill 0.677, all 5 seeds positive, bootstrap CI low 0.323 (>0), 10/10
  held-out publications with changers positive => P2_CONDITIONAL_MAGNITUDE = GO (fail-closed).
  The primary endpoint_v4 STOP is preserved and NOT overridden.'
