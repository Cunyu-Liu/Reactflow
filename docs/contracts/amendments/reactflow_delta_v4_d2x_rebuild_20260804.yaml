  superseded_authority_epoch: 6
  superseded_split_run_id: d2x_split_20260804_v1
  supersession_reason: >-
    REBUILD_REQUIRED_PUBLICATION_LEVEL_LEAKAGE. The epoch-6 D2-X split grouped
    studies only by RMDB entry (study-level) identity, not by publication.
    CIDGMP (assigned validation) and TRP4P6 (assigned train) BOTH resolve to
    NAR 2014 (pmid 25303992, SHAPE-Seq 2.0). A single publication therefore
    spans two splits, violating contract §10 zero cross-split
    publication-level leakage and contaminating the Tier B+ independence
    criterion (#1: >=3 independent study/publication units). The epoch-6
    exposure audit's publication_level field was empty (no publication-level
    grouping/audit performed). This amendment supersedes the epoch-6 D2-X
    split/exposure closure and re-authorizes a publication-level D2-X rebuild.
