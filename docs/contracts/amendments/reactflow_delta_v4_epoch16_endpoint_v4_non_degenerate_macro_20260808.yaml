amendment_summary: 'Route A (user explicit grant, epoch 16). Relaxes ONLY the PRIMARY
  metric degeneracy policy of the P2 learnability gate: endpoint_v4 computes publication-macro
  AUPRC over NON-DEGENERATE (mixed-label) publications, with constant-label publications
  explicitly listed and excluded (no silent dropping). This addresses the R5/P2_v3
  UNIDENTIFIABLE verdict: 8/10 eligible publications show strong per-pub AP but 2
  constant-label publications (pmid_25883046, pmid_35982307) triggered the frozen
  evaluate_v2 fail-closed macro. unit/label/score/mask/information-permission/caller
  UNCHANGED from endpoint_v3. Recomputes the P2 gate metric from existing held-out
  predictions (no retraining), re-adjudicates P2_LEARNABILITY_GO/STOP.'
