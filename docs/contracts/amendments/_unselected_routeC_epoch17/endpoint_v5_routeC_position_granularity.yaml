# ------------------------------------------------------------------
# 本版本变更范围（相对 endpoint_v4）—— 主评估对象切换到 position-granularity
# ------------------------------------------------------------------
change_control:
  rule: "任何 unit/label/score/metric/mask/information-permission 变更都必须产生新的 endpoint 版本，禁止原地修改本文件。"
  requires: "新 authority epoch + amendment + approval"
  v5_change_summary: >-
    Route C（用户显式授权，epoch 17）。P2 learnability 主任务（binary-changer
    publication-macro AUPRC）在 endpoint_v4 下判定为 STOP（fail-closed，paired
    bootstrap delta CI 下界含 0，publication-block permutation 因块大小唯一而
    DEGENERATE_NO_POWER）。本版本将评估单位从 pair 降到 eligible position，
    使每个 publication 贡献数千个 position 单位，从而：(1) 收紧 publication-block
    bootstrap CI（修复 endpoint_v4 下 8-10 个 publication 单位导致的宽 CI）；
    (2) 使 publication-block permutation 在 position 级 metric 下拥有真实功效
    （每个 publication 的 position-AP 是基于数千 position 的稳定估计）。
    主任务 endpoint_v4 的 STOP 结论保持冻结、不被覆盖、不被淡化为成功。
    unit 从 pair → position（eligible）；label 从 pair-level binary changer →
    per-position binary changer；score 从 pair-level P(C_i=1) → per-position
    P(y_i=1)；metric 从 publication-macro pair-AUPRC → publication-macro
    position-AUPRC。information-permission / mask / caller 与 endpoint_v4 相同。
  primary_endpoint_change_policy: "PRIMARY_ENDPOINT_NEVER_SILENT_CHANGE"
  pivot_explicit: >-
    主任务 P2 endpoint_v4 = STOP（fail-closed）已冻结（epoch 16）。本 pivot 不降低
    主任务门槛、不解封其 STOP、不把主任务改写为成功。position-granularity 是同一
    科学问题（mutation-induced reactivity response 是否跨 publication 可学习）在
    更高分辨率单位下的重新估计：修复 endpoint_v4 因 publication 单位过少导致的
    统计功效不足，而非改变核心科学问题。

# ------------------------------------------------------------------
# 预测单位与任务定义（unit 从 pair 降到 eligible position）
# ------------------------------------------------------------------
prediction_unit: "eligible position within a matched WT-exact_single-mutant pair"
task_statement: >-
  在不读取 mutant 实验 reactivity profile 的条件下，由 WT sequence、exact
  single-nucleotide mutation（ref/alt/position）、允许的 WT experimental state
  与实验条件，跨 publication 预测每个 eligible position 是否发生
  mutation-induced experimental reactivity change（per-position binary
  changer）。这是 endpoint_v4 pair 级 binary-changer 任务在 position 分辨率下的
  直接细化：position 级信号已在先前审计中观察到（22.7% eligible positions 的
  |Δreact| > 0.3）。

primary:
  unit: "position (eligible)"
  label_definition: >-
    y_i = per-position binary changer = 1[|z_i| > Z_CUT]，
    其中 z_i = (mut_i - wt_i)/(sqrt(2)*sigma_i)（caller_v3 的 per-position
    empirical-scatter z，仅 eligible positions；z 值由 train-fold caller_v3 在
    outer outcome 不可见条件下计算）。
  score: "per-position P(y_i=1)（模型直接输出 position-level 概率，禁止 pair 聚合）"
  metric: "publication-macro position-AUPRC over NON-DEGENERATE publications"
  resampling: "publication 为 outer unit；paired publication-block bootstrap；permutation 用 (b+1)/(B+1)"
  metric_semantics: >-
    在每个 publication 内，基于该 publication 的所有 eligible position 计算
    position-AP（score = per-position P(y_i=1)），再在 non-degenerate
    （mixed-label，即同时含 changer 与 non-changer position）publications 上做
    macro 平均（每 publication 等权）。constant-label publications 被显式列出并
    排除（degenerate_policies.constant_label_relaxed），排除集合必须在结果中显式
    记录，禁止静默丢弃。每个 publication 贡献数千个 position，因此其 position-AP
    是稳定估计，publication-block bootstrap CI 与 permutation 拥有真实功效。

# 预注册阈值（在结果前定死，禁止事后调整）
pre_registered_thresholds:
  go_rule: "所有条件同时满足才 GO："
  Z_CUT: 2.0
  Z_CUT_rationale: "名义双侧 ~95% 正态临界值；per-position 显著变化阈值。"
  primary_gate:
  - "publication-macro position-AUPRC 相对 trivial 基线（constant/majority predictor）的 delta > 0"
  - "paired publication-block bootstrap delta CI 下界 > 0（alpha=0.05, n_boot=1000）"
  - "publication-block permutation p < 0.05（n_perm=1000, (b+1)/(B+1)）"
  - "n_non_degenerate_publications >= 5（confirmatory 前提）"
  stop_rule: "任一 confirmatory 条件不满足 ⇒ STOP（fail-closed），如实报告，不编造数字"
  n_seeds_required: 5
  n_models_required: 3

conditional:
  unit: "position (eligible, TRUE CHANGERS only)"
  label_definition: "|delta_r| magnitude on changer positions"
  score: "position-level |delta_r_hat|"
  metric: "conditional WMAE skill"
  note: "评价与 primary 任务严格分表；本轮不作为 primary"

secondary:
  unit: "position (eligible)"
  label_definition: "连续 noise-weighted signed delta"
  score: "signed delta_r_hat"
  metric: "WMAE skill / Spearman"
  note: "评价与 primary 任务严格分表，禁止混用"

# ------------------------------------------------------------------
# 信息权限（与 endpoint_v4 相同）
# ------------------------------------------------------------------
information_permission:
  allowed_inputs:
  - "WT sequence (canonical_sequence)"
  - "exact single-nucleotide mutation: ref_allele / alt_allele / position(coordinate)"
  - "experimental condition: buffer / ligand / probe / temperature / experimentType / environment"
  - "allowed WT experimental reactivity state（仅 WT profile，不含 mutant profile）"
  - "per-group empirical WT replicate scatter（caller_v3 噪声模型；仅 WT profile，不含 mutant outcome）"
  - "structure/thermo 特征（来自 WT 或 three-alt 静态计算，不得携带 actual-alt mutant 信息）"
  forbidden_inputs:
  - "mutant 实验 reactivity profile（prospective input 禁止）"
  - "mutant noise/error profile"
  - "actual-alt exact thermodynamic result"
  - "test/outer-fold outcome 或任何以 outcome 为条件的统计量"
  - "target mask（目标缺失模式）不得作为 prospective input"
  target_mask_policy: "target mask 只能用于排除不可评估 position，不得作为预测输入"

# ------------------------------------------------------------------
# Mask / position eligibility（与 endpoint_v4 相同）
# ------------------------------------------------------------------
mask:
  primary_position_eligibility_rules:
  - "edited-site（突变位点本身）排除，不参与 response 评估"
  - "alignment-change 位置排除"
  - "probe-eligibility 变化的位置排除"
  - "NaN / missing reactivity 位置排除，缺失不填零"
  - "length mismatch 排除"
  eligibility_reason_codes:
  - EDITED_SITE
  - ALIGNMENT_CHANGE
  - PROBE_ELIGIBILITY_CHANGE
  - MISSING_REACTIVITY
  - LENGTH_MISMATCH
  - ELIGIBLE
  mask_policy: "所有 primary position 必须有明确 eligibility reason code；无 ELIGIBLE 记录不得进入 evaluator"

# ------------------------------------------------------------------
# Caller（R3v3，与 endpoint_v4 相同；仅暴露 per-position z）
# ------------------------------------------------------------------
caller_contract:
  scope: "train-fold replicates + controls only；outer 行 outcome 不可见（null 与 reliability 仅用 train fold）"
  label: "per-position binary changer y_i = 1[|z_i| > Z_CUT]"
  noise_model: >-
    per-position empirical scatter sigma_i = sample SD(ddof=1) across the
    replicate group's WT profiles；z_i = (mut_i - wt_i)/(sqrt(2)*sigma_i)。
    reported errors 不再作为噪声源（caller_v2 中失准）。per-study
    (median/MAD) 归一化在 z 比值中抵消，故不显式施加。
  reliability: "pair 级 reliability 过低时该 pair 的所有 position 不产出 label（NO_CALL），不强制下标签"
  determinism: "同输入 hash 同输出；deterministic seed；sliding cluster；spatial-block null（train-only）"

# ------------------------------------------------------------------
# 退化与不可识别边界（position-granularity）
# ------------------------------------------------------------------
degenerate_policies:
  constant_label: "RELAXED_VIA_EXPLICIT_EXCLUSION：constant-label publication 显式列出并排除；macro 在 non-degenerate publications 上计算"
  constant_label_exclusion_documented: "排除集合必须写入结果（degenerate_publications 字段），禁止静默丢弃"
  all_publications_degenerate: "若所有 publications 均 constant-label，返回 UNIDENTIFIABLE（无可用 non-degenerate 集合）"
  publication_lt_3: "non-degenerate publication < 3 时禁止 confirmatory CI，返回 UNIDENTIFIABLE"
  publication_lt_5_go_hold: "non-degenerate publication < 5 时 confirmatory GO 被 hold（可报告描述性，不判 GO）"
  no_eligible_position: "publication 无 eligible position ⇒ 无 position-AP，从 macro 排除并显式记录"
  missing_info_not_zero: "缺失信息不得填充为零"
  tied_ap_row_order_invariant: "tied AP 必须与行序无关"

# ------------------------------------------------------------------
# 版本与冻结
# ------------------------------------------------------------------
integrity:
  hash_algorithm: SHA256
  file_hash_mode: RAW_FILE_BYTES
  detached_ledger_path: configs/reactflow_delta/endpoint_v5.sha256
  change_requires_new_version: true
