governing_contract: docs/contracts/ReactFlowDelta_M0X_strict_scientific_engineering_audit_20260807.md
governing_amendment: docs/contracts/amendments/reactflow_delta_v4_epoch17_endpoint_v5_position_granularity_20260808.yaml
authority_epoch: 17
