amendment_kind: ENDPOINT_V5_POSITION_GRANULARITY_ROUTE_C
amendment_summary: >-
  Route C (user explicit grant, epoch 17). After the P2 primary (binary-changer
  publication-macro AUPRC) was adjudicated STOP (fail-closed, paired bootstrap delta
  CI lower bound includes 0; publication-block permutation DEGENERATE_NO_POWER due to
  unique block sizes) under endpoint_v4, the evaluation unit is reduced from pair to
  eligible position. This makes each publication contribute thousands of position units,
  which (1) tightens the publication-block bootstrap delta CI (fixing the wide-CI /
  low-power problem caused by only 8-10 publication units in endpoint_v4), and (2) gives
  the publication-block permutation real power (each publication's position-AP is a stable
  estimate over thousands of positions). The primary endpoint_v4 STOP is frozen and NOT
  overridden, NOT relaxed, NOT rewritten as success. unit: pair -> position (eligible);
  label: pair binary changer -> per-position binary changer y_i = 1[|z_i| > Z_CUT];
  score: pair-level P(C_i=1) -> per-position P(y_i=1); metric: publication-macro pair-AUPRC
  -> publication-macro position-AUPRC over NON-DEGENERATE publications. information-permission
  / mask / caller semantics preserved (caller_v3 exposes per-position z). This is the same
  core scientific question (is mutation-induced reactivity response cross-publication
  learnable) re-estimated at higher unit resolution to repair statistical power, not a
  change of the scientific question.
