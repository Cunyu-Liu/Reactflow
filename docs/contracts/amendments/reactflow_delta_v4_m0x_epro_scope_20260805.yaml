amendment_summary: >-
  User explicitly authorized immediate execution of EPRO_DEV_03 and continuation
  of M0-X EPRO controlled development with: (1) full single-GPU budget (40G),
  (2) all train+validation data, (3) model capacity scaled up to the largest
  single-card-trainable size, (4) iteration limit removed (continue until the
  model beats the P2 WT-anchored baseline on validation changer detection),
  (5) multi-layer calibration (temperature + isotonic), (6) pretraining arm B
  enabled and extended. Test split remains SEALED and is never used for training.
  GPU 4 exclusion remains REQUIRED.
supersedes_capacity_ceiling: >-
  Tier B+ ceiling of 250k params is EXPANDED for this continuation to the largest
  single-card-trainable model, per explicit user instruction. This does not
  restore EPRO-Lite historical 4.46M claim; it authorizes NEW larger-capacity
  development runs only.
supersedes_iteration_window: >-
  The 28-day/6-iteration window limit is SUSPENDED per explicit user instruction;
  development continues until the model beats the P2 baseline, then M0-X gate is
  re-judged against contract criteria.
