decisions:
  - id: V5D001
    status: FROZEN
    decision: TEST_EXACT_MUTANT_MINUS_WT_BOLTZMANN_ENSEMBLE_CHANGE
    rationale: >-
      V4 used a learned WT pair field and paired RNA-FM representations but did
      not explicitly calculate the structural ensemble perturbation caused by
      the exact mutation.
  - id: V5D002
    status: FROZEN
    decision: REQUIRE_LINEAR_SIGNAL_ELIGIBILITY_BEFORE_ANY_NEURAL_RESIDUAL_SCREEN
    rationale: >-
      The physical feature must demonstrate cross-puzzle incremental signal in
      a fixed low-capacity learner before it can justify another GPU model.
  - id: V5D003
    status: FROZEN
    decision: PRESERVE_CORRECTED_B1_AND_ADD_ONLY_A_ZERO_INITIALIZED_RESIDUAL_BRANCH
    rationale: >-
      Corrected B1 remains the strongest qualified mean baseline; v5 must add a
      capability rather than replace it with another high-capacity encoder.
  - id: V5D004
    status: FROZEN
    decision: KEEP_FIVE_PERCENT_TOP_JOURNAL_DUAL_METRIC_GATE
    rationale: >-
      Repeated sub-percent development changes are not a publishable method result.
  - id: V5D005
    status: FROZEN_IMPLEMENTED
    decision: SCORE_POSITION_THEN_MUTANT_THEN_METHOD_CELL_THEN_PUZZLE
    rationale: >-
      Direct position pooling gives mutants with more qualified receivers greater
      weight and is not the contract estimand. Mutant identity includes construct,
      design position and ref>alt so equal allele changes at different sites remain
      distinct.

