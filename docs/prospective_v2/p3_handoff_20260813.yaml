implementation_integrity: >-
  INVALIDATED (owner-audit 2026-08-15). The trained model in v1/v2 was NOT trained
  per the frozen spec (contract 10.2/9.1/7.4/14.1):
  (1) the WT context encoder was detached to a FIXED random feature map during
  training (v2 line 117 `H = model.encoder(...)[0].detach()`), so the trainable
  2-block attention encoder specified by contract 10.2 never learned;
  (2) missing mutant-target reactivity was 0-filled BEFORE the observation mask was
  computed (`targets = np.nan_to_num(...)` then `masks_t = ~np.isnan(targets)`), so
  every position was treated as observable and the model was trained to predict 0 at
  unobserved positions (contract 7.4/14.1.3: missing != 0; TARGET_UNOBSERVABLE);
  (3) training used a single seed, 6 fixed epochs, and NO inner 4-fold puzzle-grouped
  validation, no inner CRPS early stopping, no {lr,wd,likelihood} selection
  (contract 10.2 requires max 200 epochs w/ inner early stopping; 9.1 requires the
  five-seed {0..4} equal-weight mixture).
  => The resulting NO_INCREMENTAL_LRSO_SKILL is an implementation failure verdict,
  NOT an honest test of the LRSO architecture. It CANNOT be cited.
implementation_fix: >-
  run_p3_lrso_v3.py (NEW, supersedes v1/v2): trainable WT encoder (no detach);
  per-mutant macro masked NLL where the target-qualified mask is computed from the
  RAW profile BEFORE any fill (missing never equals 0; NaN positions contribute
  ZERO to the loss numerator and denominator); inner 4-fold puzzle-grouped
  validation selects {lr 3e-4/1e-3, wd 0/1e-4, likelihood Gaussian/Student-t} and the
  early-stopped epoch count (max 200, patience 20) by inner OOF CRPS; final model
  trained per fold for the selected epoch count on full outer-train for each of
  seeds {0,1,2,3,4} with torch.manual_seed(seed) BEFORE construction (reproducible
  per-seed init); held CRPS scored directly on the five-seed equal-weight
  Gaussian mixture (contract 9.1); scale uses softplus + train-only floor (10.2.1);
  WT missing positions excluded from attention/loss/scoring and numeric input
  mean-filled (NOT 0) with a WT-observed token.
  v1/v2 are DEPRECATED/INVALID (deprecation header added at module top; retained
  for audit only, must not be run as the official P3 runner).
