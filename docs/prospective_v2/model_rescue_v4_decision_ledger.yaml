      Corrected B1 does not recompute an exact-mutant receiver representation and has
      no learned pair field through which source information can reach all positions.
  - id: V4D002
    status: FROZEN
    decision: USE_OFFICIAL_RNA_FM_T12_AS_FROZEN_PRIMARY_FOUNDATION
    repository_commit: 348951516e0963d22bbb33b3c9fc18c89081d38e
    checkpoint_source: https://huggingface.co/cuhkaih/rnafm/resolve/main/RNA-FM_pretrained.pth
    checkpoint_loading: EXPLICIT_LOCAL_PATH_REQUIRED
    package_loading: EXPLICIT_CLEAN_GIT_CHECKOUT_AT_REPOSITORY_COMMIT_REQUIRED
    rationale: >-
      RNA-FM provides nucleotide representations without OpenKnot outcome labels and
      is small enough to cache deterministically; exposure is disclosed rather than
      claimed absent.
  - id: V4D003
    status: FROZEN
    decision: USE_512_WIDTH_TEN_SEQUENCE_BLOCK_FIVE_PAIR_BLOCK_CONFIGURATION
    rationale: This is a single 35M-45M trainable-capacity hypothesis, not a size search.
  - id: V4D004
    status: FROZEN
    decision: REQUIRE_SCRATCH_FOUNDATION_ONLY_AND_CAPACITY_MATCHED_NULL_CONTROLS
    rationale: Separate capacity, foundation representation, and pair/source-row contributions.
  - id: V4D005
    status: FROZEN
    decision: REQUIRE_FIVE_PERCENT_DUAL_METRIC_DEVELOPMENT_GAIN_AND_EXTERNAL_REPLICATION
    rationale: Small statistically positive improvements are inadequate for the requested top-journal route.
  - id: V4D006
    status: SUPERSEDED_BY_V4D007_OWNER_AUTHORIZATION
    decision: V3_USES_GPU0_TO5_AND_V4_MAY_USE_ONLY_IDLE_GPU6_OR_GPU7
    rationale: PRESERVE_RUNNING_V3_AND_UNRELATED_TASKS
  - id: V4D007
    status: FROZEN
    decision: V4_MAY_USE_GPU0_TO7_WHEN_CURRENT_STAGE_HAS_SUFFICIENT_AVAILABLE_MEMORY
    owner_authorized_at: '2026-08-23'
    rationale: >-
      Owner explicitly expanded v4 from idle GPU6/7 to GPU0-5 and any card with
      available memory. Existing processes remain protected from signals,
      termination, preemption, or mutation.
  - id: V4D008
    status: TERMINAL
    decision: CLOSE_V4_AFTER_PREFROZEN_V4M3_GATE_FAILURE_AND_RETURN_TO_M6_BENCHMARK_ROUTE
    decided_at: '2026-08-24T11:37:00+08:00'
    rationale: >-
      The complete 20-fold seed-0 universe was scored only after the merge passed.
      The pre-frozen qualifier returned MODEL_RESCUE_V4_FAIL: the primary did not
      improve corrected B1 on CRPS, improved signed-delta MAE by only 0.2267%,
      failed the capacity-null attribution CI, worsened 95% coverage error beyond
      tolerance, and had no qualified task-matched published comparator. V4M4 is
      therefore prohibited rather than used as a second opportunity to search.

