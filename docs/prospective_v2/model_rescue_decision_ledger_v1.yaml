inferences:
  - id: I_DIRECT_LOW_RANK_OVERLAP
    status: REASONED_INFERENCE
    statement: >-
      The nonlinear direct branch already consumes global WT receiver context,
      mutation identity and distance, so it can absorb source-receiver functions
      that the low-rank branch was intended to isolate.
    required_test: LOCAL_ONLY_DIRECT_VS_NONLOCAL_SOURCE_RECEIVER_CONTROL
  - id: I_OBJECTIVE_MISMATCH
    status: REASONED_INFERENCE
    statement: >-
      CRPS improvement with negative signed-delta point skill is consistent with
      a near-zero-dominated response distribution and uncertainty/tail gains that
      do not improve the mutation-effect mean.
    required_test: FAILURE_ATLAS_AND_SPARSE_DELTA_MDN
  - id: I_STRUCTURE_DISTANCE
    status: NEW_EXPERIMENT_REQUIRED
    statement: >-
      WT ensemble base-pair proximity may explain sequence-distant mutation
      responses better than signed sequence distance.
    required_test: OUTCOME_BLIND_STRUCTURE_FEATURE_PROBE

