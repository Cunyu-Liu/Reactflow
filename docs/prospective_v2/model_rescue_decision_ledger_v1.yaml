route_rules:
  - if: INTERNAL_DUAL_PRIMARY_FAIL
    then: BENCHMARK_ROUTE_LOCKED
  - if: INTERNAL_PASS_AND_EXTERNAL_NOT_ESTABLISHED
    then: BENCHMARK_WITH_DEVELOPMENT_MODEL_BASELINE
  - if: INTERNAL_AND_NEW_EXTERNAL_DUAL_PASS
    then: METHOD_AUGMENTED_BENCHMARK_ELIGIBLE
  - if: ONLY_CRPS_PASS_AND_SIGNED_DELTA_FAIL
    then: CALIBRATION_BASELINE_ONLY

