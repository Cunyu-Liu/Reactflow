  - id: C_DIRECT_LEARNABILITY
    current_status: POST_HOC_DEVELOPMENT_PASS
    allowed_text: Direct models improve development-set full-construct CRPS.
    prohibited_upgrade: PROSPECTIVE_CONFIRMATION
  - id: C_LOW_RANK_METHOD
    current_status: SMALL_SIGNIFICANT_BELOW_PRACTICAL_GATE
    allowed_text: A selected positive rank adds a small development CRPS and delta-MAE increment over rank zero, below the practical gate.
    prohibited_text: Low-rank susceptibility is the dominant source of performance.
  - id: C_SIGNED_MUTATION_EFFECT
    current_status: CURRENT_NETWORK_DEVELOPMENT_PASS_VS_WT
    allowed_text: Under evaluator_v2, the current rank-zero and selected-rank networks improve development signed-delta MAE over WT anchor.
    prohibited_text: This is prospective or externally replicated signed mutation-effect evidence.
  - id: C_EXTERNAL_GENERALIZATION
    current_status: NOT_ESTABLISHED
    prohibited_text: The final method replicates across independent external studies.
  - id: C_MECHANISM
