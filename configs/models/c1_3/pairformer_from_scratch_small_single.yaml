schema_version: '2.0'
loss:
  bce_weight: 1.0
  focal_weight: 0.5
  soft_f1_weight: 0.5
  dice_weight: 0.0
  pair_count_weight: 0.1
  symmetry_weight: 0.01
  calibration_weight: 0.1
  unpaired_weight: 0.5
  long_range_weight: 0.1
  long_range_threshold: 24
  long_range_upweight_factor: 2.0
  focal_gamma: 2.0
  bce_pos_weight: null
  bce_pos_weight_auto: true
  ece_num_bins: 15
training:
  device: cuda:6
  world_size: 1
  use_ddp: false
  use_fsdp: false
  use_bf16: true
  use_grad_checkpoint: true
  use_flash_attention: false
  max_grad_norm: 1.0
  oom_retry_max: 3
  nan_inf_guard: true
  log_interval: 100
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  warmup_steps: 1000
  cosine_decay_steps: 0
  resume_from: null
  save_every: 1
  eval_every: 1
  early_stop_patience: 5
  early_stop_min_delta: 0.001
  batch_size: 16
  eval_batch_size: 8
  num_workers: 4
  pin_memory: true
  epochs: 19
  checkpoint_dir: artifacts/c1_3/runs/pairformer_from_scratch_small_single_seed{seed}
curriculum:
  replay_ratio: 0.2
  balance_keys:
  - source
  - family
  - clan
  - length_bin
  - pair_distance_bin
  - structure_complexity
  stages:
  - short_nested_ncRNA
  - mixed_rfam
  - pri_miRNA
  - pdb
  - viral
  - human_mRNA
  - lncRNA
  stage_epochs:
    short_nested_ncRNA: 3
    mixed_rfam: 5
    pri_miRNA: 2
    pdb: 3
    viral: 2
    human_mRNA: 2
    lncRNA: 2
data:
  splits_path: /home/cunyuliu/reactflow/artifacts/full_runs/full_ablation_20260709_003012/splits/rfam_current_mmseqs_seed0
  train_split: train
  val_split: val
  test_split: test
  novel_split: novel
  max_length: 512
  min_length: 4
decoder:
  default_mode: mea
  threshold: 0.5
  min_score: 0.0
  min_loop: 3
  allow_wobble: true
  seq_pad_index: 5
config_name: pairformer_from_scratch_small_single
backbone:
  name: from_scratch
  mode: full_fine_tune
  lora_rank: 0
model:
  model_type: static_pairformer
  single_dim: 384
  pair_dim: 96
  max_len: 512
  num_blocks: 12
  num_heads_pair: 6
  num_heads_single: 6
  triangle_hidden_dim: null
  ffn_expansion: 4
  outer_product_mean_dim: 16
  use_onehot: false
  learnable_pos: true
  frozen_feature_dim: 0
  dropout: 0.0
  block_dropout: 0.0
  num_pair_types: 0
  use_calibration: true
  init_temperature: 1.0
  share_pair_init_projection: true
  num_region_labels: 0
fusion:
  fusion_type: single_only
  single_dim: 384
  pair_dim: 96
  num_backbones: 1
  dropout: 0.0
seed: 0
