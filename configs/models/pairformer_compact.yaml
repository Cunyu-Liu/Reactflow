# Compact Static PairFormer configuration (C1-2 pilot)
#
# Spec reference: ReactFlow分阶段执行提示词.md lines 332-452
#
# This is the main C1-2 model.  It directly predicts symmetric L x L base-pair
# logits via a compact Evoformer-style backbone with triangle multiplicative
# updates, triangle attention, outer-product-mean, and pair-to-single attention.
#
# Capacity target: ~1-2M parameters (matched-capacity with baselines).

schema_version: "1.0"
model_type: "static_pairformer"
config_name: "pairformer_compact"

model:
  single_dim: 256
  pair_dim: 64
  max_len: 128                # pilot: L <= 128
  num_blocks: 8
  num_heads_pair: 4
  num_heads_single: 8
  triangle_hidden_dim: null   # defaults to pair_dim
  ffn_expansion: 4
  outer_product_mean_dim: 16  # small to keep memory low
  use_onehot: false
  learnable_pos: true
  frozen_feature_dim: 0
  dropout: 0.0
  block_dropout: 0.0
  num_pair_types: 0           # 0 disables pair-type head
  use_calibration: true
  init_temperature: 1.0
  share_pair_init_projection: true
  num_region_labels: 0

# Loss configuration
loss:
  bce_weight: 1.0
  focal_weight: 0.5
  soft_f1_weight: 0.5
  dice_weight: 0.0
  pair_count_weight: 0.1
  symmetry_weight: 0.01
  calibration_weight: 0.1
  unpaired_weight: 0.5
  focal_gamma: 2.0
  bce_pos_weight: null
  bce_pos_weight_auto: true
  ece_num_bins: 15

# Training configuration
training:
  max_len: 128                # pilot filter
  batch_size: 8               # small to fit in MIG slice
  eval_batch_size: 4
  epochs: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 200
  max_grad_norm: 1.0
  use_amp: false              # disable AMP to avoid float16 NaN
  num_workers: 4
  pin_memory: true
  log_every: 20
  eval_every_epochs: 1
  save_every_epochs: 1

# Data configuration
data:
  # Frozen C1-1 benchmark manifest (server path)
  manifest_path: "artifacts/c1_1/frozen_benchmark_manifest.json"
  # Cache root containing per-source JSONL files
  cache_root: "data/cache"
  # Splits to load
  train_split: "train"
  val_split: "val"
  test_split: "test_mmseqs"
  novel_split: "novel_clan"
  # Length filter for pilot
  max_length: 128
  min_length: 4

# Decoder configuration (matches static_v1.yaml evaluator contract)
decoder:
  default_mode: "nussinov_dp"
  threshold: 0.5
  min_score: 0.0
  min_loop: 3
  allow_wobble: true
  seq_pad_index: 5

# Reproducibility
seed: 0
