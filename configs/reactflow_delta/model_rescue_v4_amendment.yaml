  - {id: V4M3, status: NOT_AUTHORIZED, next_on_pass: V4M4, next_on_fail: V4M6_FAIL}
  - {id: V4M4, status: NOT_AUTHORIZED, next_on_pass: V4M5, next_on_fail: V4M6_FAIL}
  - {id: V4M5, status: SEPARATE_AMENDMENT_REQUIRED, next_on_pass: V4M6_PASS, next_on_fail: V4M6_DEVELOPMENT_ONLY}
  - {id: V4M6, status: NOT_RUN, handoff_phase: M6}

compute:
  v4_allowed_physical_gpus: [6, 7]
  v3_reserved_physical_gpus: [0, 1, 2, 3, 4, 5]
  idle_only: true
  unrelated_job_interference_allowed: false
  unlimited_budget_means_fixed_protocol_completion_only: true

claim_policy:
  engineering_pass_is_scientific_pass: false
  internal_pass: HIGH_EFFECT_POST_HOC_DEVELOPMENT_PASS
  external_replication: NOT_ESTABLISHED_UNTIL_V4M5
