  comparator: corrected_b1

foundation:
  primary:
    model: RNA_FM_T12
    official_repository: https://github.com/ml4bio/RNA-FM
    repository_commit: 348951516e0963d22bbb33b3c9fc18c89081d38e
    loader: fm.pretrained.rna_fm_t12
    checkpoint_source: https://huggingface.co/cuhkaih/rnafm/resolve/main/RNA-FM_pretrained.pth
    checkpoint_loading: EXPLICIT_LOCAL_PATH_REQUIRED
    package_loading: EXPLICIT_CLEAN_GIT_CHECKOUT_AT_REPOSITORY_COMMIT_REQUIRED
    checkpoint_family: OFFICIAL_RNA_FM_T12
    layers: 12
    hidden: 640
    frozen_parameters_approx: 99000000
    pretraining_corpus: RNACENTRAL100_APPROX_23_7M_NONCODING_RNA
    gradient_allowed: false
    use: PAIRED_WT_AND_EXACT_MUTANT_FINAL_LAYER_NUCLEOTIDE_EMBEDDINGS
    exact_openknot_sequence_overlap: UNKNOWN_NOT_ASSERTED
  sensitivity_only:
    model: RINALMO_650M
    selectable_as_primary: false
  exposure_disclosed_comparator_only:
    model: RIBONANZANET
    clean_primary_foundation_claim_allowed: false

input_permission:
  allowed_prediction_inputs:
    - WT_SEQUENCE
    - EXACT_MUTANT_SEQUENCE
    - WT_REACTIVITY
    - WT_REACTIVITY_ERROR
    - WT_OBSERVED_MASK_AS_FEATURE
    - FULL_CONSTRUCT_POSITION
    - DESIGN_REGION
    - CORRECTED_FULL_MUTATION_POSITION
    - MUTATION_REF_ALT
    - SIGNED_SOURCE_RECEIVER_DISTANCE
    - FROZEN_RNAFM_WT_EMBEDDING
    - FROZEN_RNAFM_MUTANT_MINUS_WT_EMBEDDING
  prohibited_prediction_inputs:
    - HELD_MUTANT_REACTIVITY
    - HELD_MUTANT_ERROR
    - HELD_QUALIFIED_TARGET_MASK
    - HELD_SCORE
    - PUZZLE_ID
    - DESIGN_METHOD
    - DATASET_ID
    - PUBLICATION_ID
    - EXTERNAL_OUTCOME
    - OUTCOME_DERIVED_STRUCTURE
  foundation_cache_csv_columns: [id, puzzle, method, sequence]

models:
  primary:
    id: v4_dual_tower_rnafm
    family: MUTATION_CONDITIONED_DUAL_TOWER_RESPONSE_TRANSFORMER
    sequence_width: 512
    attention_heads: 8
    wt_sequence_blocks: 5
    response_sequence_blocks: 5
    feedforward_width: 2048
    pair_width: 128
    pair_axial_blocks: 5
    dropout: 0.10
    foundation_width: 640
    trainable_parameter_min: 35000000
    trainable_parameter_max: 45000000
  required_controls:
    - corrected_b1
    - v4_dual_tower_scratch
    - v4_rnafm_only
    - v4_capacity_matched_sequence_null
  capacity_null:
    pair_tower_allowed: false
    pair_source_row_column_allowed: false
    paired_rnafm_allowed: true
    unused_parameter_ballast_allowed: false
    max_relative_trainable_parameter_difference: 0.05
  search:
    architecture_search_allowed: false
    foundation_search_allowed: false
    hidden_size_search_allowed: false
    depth_search_allowed: false
    rank_search_allowed: false
    loss_weight_search_allowed: false
    epoch_search_allowed: false
    seed_subset_selection_allowed: false

training:
  mean:
    loss: EXACT_METHOD_BALANCED_SIGNED_DELTA_L1
    epochs: 80
    optimizer: ADAMW
    learning_rate: 0.0002
    weight_decay: 0.01
    schedule: COSINE_WITH_FIVE_PERCENT_WARMUP
    dropout: 0.10
    gradient_clip: 1.0
    precision: BF16_WHEN_SUPPORTED_OTHERWISE_FP32
    early_stopping_allowed: false
  calibration:
    family: CONDITIONAL_TWO_GAUSSIAN_ZERO_MEAN_SCALE_MIXTURE
    loss: EXACT_GAUSSIAN_MIXTURE_CRPS
    epochs: 40
    mean_gradient_allowed: false
    foundation_gradient_allowed: false
    component_locations: BOTH_EQUAL_DETACHED_POINT_MEAN

prediction_schema:
  id: reactflow_delta.model_rescue_v4_prediction.v1
  required_fields: [biological_scoring_key, candidate_id, outer_fold, seed, delta_mean, point_mean, locations, scales, weights, registered_status, mean_checkpoint_path, calibration_checkpoint_path]
  forbidden_fields: [target, target_error, qualified_target_mask, score]

development_gate:
  phase: V4M3
  seed: 0
  outer_folds: 20
  complete_before_score_access: true
  versus_corrected_b1:
    crps_relative_gain_min: 0.05
    signed_delta_mae_relative_gain_min: 0.05
    crps_paired_ci_lower_gt: 0.0
    signed_delta_mae_paired_ci_lower_gt: 0.0
    crps_positive_puzzles_min: 16
    signed_delta_mae_positive_puzzles_min: 16
    leave_one_puzzle_effect_positive: true
    max_single_puzzle_effect_fraction: 0.20
  attribution:
    beat_capacity_matched_null_on_both_metrics: true
    capacity_null_both_paired_ci_lower_gt: 0.0
    beat_rnafm_only_on_both_metrics: true
    rnafm_only_both_paired_ci_lower_gt: 0.0
    scratch_ablation_report_required: true
  prediction_coverage: 1.0
  failure_rate: 0.0
  unexpected_keys: 0
  max_coverage_error_worsening_pp: 1.0
  point_mean_calibration_atol: 1.0e-7
  strongest_task_matched_published_comparator_must_be_beaten: true

formal_confirmation:
  phase: V4M4
  seeds: [0, 1, 2, 3, 4]
  outer_folds: 20
  model_universe: [corrected_b1, v4_dual_tower_rnafm, v4_dual_tower_scratch, v4_rnafm_only, v4_capacity_matched_sequence_null]
  selection_allowed: false
  gate: SAME_AS_DEVELOPMENT_GATE_ON_UNIQUE_FIVE_SEED_MIXTURES
  internal_pass_status: HIGH_EFFECT_POST_HOC_DEVELOPMENT_PASS

external_gate:
  phase: V4M5_SEPARATE_AMENDMENT_REQUIRED
  new_independent_outcome_required: true
  freeze_before_access_required: true
  crps_relative_gain_min: 0.03
  signed_delta_mae_relative_gain_min: 0.03
  cluster_level_ci_lower_gt: 0.0
  top_level_study_or_publication_consistent_fraction_min: 0.75
  final_pass_status: TOP_JOURNAL_EVIDENCE_CHAIN_PASS

phase_graph:
  - {id: V4M0, status: PASS, next_on_pass: V4M1}
  - {id: V4M1, status: IN_PROGRESS, training_allowed: false, next_on_pass: V4M2}
