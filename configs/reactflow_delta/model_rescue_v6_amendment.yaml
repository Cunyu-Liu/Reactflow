hypothesis:
  located_observation: >-
    Sequence-only exact ensemble-delta features improved signed-delta MAE in
    all 20 puzzles with CI above zero, but only by 0.634%, below eligibility.
  missing_capability: >-
    The nearest-neighbor ensemble is not conditioned on the experimentally
    observed WT 2A3 flexibility field available to the predictor.
  prediction: >-
    WT-2A3-constrained exact-mutant minus WT ensemble features add at least 1%
    signed-delta MAE improvement beyond direct plus unconstrained features.
  falsifier: >-
    The complete V6M2 incremental probe fails any frozen Gate or the later
    primary cannot beat corrected B1 and identical-capacity controls.

