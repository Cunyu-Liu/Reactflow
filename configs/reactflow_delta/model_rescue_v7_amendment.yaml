dependency_definition:
  sequence_input: FULL_UNMASKED_WT_AND_EXACT_REGISTERED_MUTANT_SEQUENCE
  alphabet: [A, C, G, U]
  logits_source: RINALMO_GIGA_MLM_HEAD
  acgu_probability: SOFTMAX_OVER_ACGU_LOGITS
  epsilon: 1.0e-10
  for_each_target_base: >-
    log2(p_mut/(1-p_mut))-log2(p_wt/(1-p_wt))
  self_dependency: ZERO_AT_RECEIVER_EQUAL_TO_MUTATION_SOURCE
  fixed_feature_basis:
    - SIGNED_LOG_ODDS_SHIFT_A
    - SIGNED_LOG_ODDS_SHIFT_C
    - SIGNED_LOG_ODDS_SHIFT_G
    - SIGNED_LOG_ODDS_SHIFT_U
    - SIGNED_LOG_ODDS_SHIFT_FOR_WT_RECEIVER_BASE
    - MAX_ABSOLUTE_LOG_ODDS_SHIFT
  cache_key: EXACT_WT_SEQUENCE_EXACT_MUTANT_SEQUENCE_SOURCE_RECEIVER
  exact_sequence_cache_reuse_if_present: true
  real_m2_cross_method_sequence_reuse: false
  mutant_outcome_columns_allowed: false
  target_error_or_mask_allowed: false
  external_outcome_allowed: false
  feature_or_layer_search_allowed: false
  model_size_search_allowed: false

