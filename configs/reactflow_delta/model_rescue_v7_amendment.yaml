evidence_basis:
  legacy_v4_v5_v6_status: SCIENTIFICALLY_INVALIDATED_TARGET_IDENTITY
  v4_observation: >-
    A 35M-45M dual tower using paired RNA-FM representations was statistically
    equivalent to corrected B1. More foundation parameters and embedding
    differencing alone did not expose a usable mutation-response signal.
  v5_observation: >-
    Exact-mutant minus WT unconstrained thermodynamic ensemble features improved
    signed-delta MAE by 0.633962%, with 20/20 positive puzzles, below the frozen
    one-percent eligibility threshold.
  v6_observation: >-
    Adding WT-2A3-constrained ensemble features beyond V5 improved signed-delta
    MAE by only 0.116060%, with 16/20 positive puzzles and CI above zero, again
    below the one-percent threshold.
  resulting_gap: >-
    Existing models encode sequence context or thermodynamic ensemble changes,
    but do not expose a pretrained directed intervention map from the actual
    mutation source to every receiver nucleotide.
  corrected_comparator_rebuild:
    status: TIC2A_CORRECTED_BASELINE_REBUILD_PASS
    target_identity: EXACT_PUZZLE_METHOD_MUTATION
    legacy_prediction_reused: false
    model_selection_performed: false
    direct18_to_v6_feature41_signed_delta_relative_gain: 0.012815157514742657
    direct18_to_v6_feature41_signed_delta_positive_puzzles: 20
    direct18_to_v6_feature41_absolute_delta_relative_gain: 0.012634284393969065
    direct18_to_v6_feature41_absolute_delta_positive_puzzles: 19
    qualification_artifact: /mnt/cunyuliu/reactflow_delta_target_identity_correction/tic2a_corrected_baselines/tic2a_corrected_qualification.json

hypothesis:
  statement: >-
    Exact unmasked RiNALMo-Giga log-odds changes induced by the registered SNV
    provide a directed source-to-receiver dependency signal that improves
    cross-puzzle signed-delta prediction beyond direct, unconstrained ensemble,
    and WT-2A3-constrained ensemble features.
  why_not_v4: >-
    V4 supplied contextual embeddings to a small supervised tower and required
    nineteen training puzzles to learn the intervention relation. V7 computes
    the intervention relation directly from the pretrained MLM output logits.
  prediction: >-
    A fixed weighted ridge using dependency features will improve signed-delta
    MAE by at least one percent beyond the exact V6 candidate replay.
  falsifier: >-
    The complete twenty-fold probe fails any eligibility Gate, or the later
    dependency operator fails the five-percent dual-metric development Gate and
    equal-capacity attribution controls.

