scope:
  hypothesis: >-
    Correctly aligned frozen RibonanzaNet2 single-nucleotide representations
    contain transferable chemical context that improves unseen-puzzle mutant
    response prediction beyond an otherwise identical student distilled from
    the same representations after a fixed within-sequence coordinate shift.
  result_class: EXPOSURE_DISCLOSED_DEVELOPMENT_CANDIDATE
  evidence_ceiling: >-
    RibonanzaNet2 training-family near-neighbor exposure to OpenKnot cannot be
    excluded, OpenKnot M2 has already been repeatedly consumed for development,
    and no new sealed external outcome is authorized. Even an exact screen or
    formal PASS is not clean OOD, SOTA, publication-ready, or external evidence.
  old_routes_closed:
    - V14_MASKED_WT_PROFILE_PRETRAINING
    - POST_V14_BRANCH5_ROUTE_PROBE
    - P1_PROJECTION
    - P2_QUANTILE_RESIDUAL
    - P3_MODEL_RESCUE

