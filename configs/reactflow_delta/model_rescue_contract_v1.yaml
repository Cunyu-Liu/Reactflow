schema_version: reactflow_delta.model_rescue_contract.v1
contract_id: reactflow_delta_model_rescue_v1_20260820
created_at: '2026-08-20T14:00:00+08:00'
contract_status: TERMINAL_M2_NO_RESCUE_CANDIDATE_BENCHMARK_ROUTE_LOCKED

owner_instruction:
  raw_message: 继续
  received_at: '2026-08-20'
  interpretation: >-
    Continue the agreed performance-first model-rescue plan. LRSO may be retired;
    development analysis and bounded model training are authorized after M0 and M1
    gates. New external outcomes remain locked until the final model is frozen.

scope:
  project_task_id: reactflow_delta
  primary_task: >-
    Given a WT sequence, its WT chemical-reactivity profile and measurement
    availability, and an exact single-nucleotide mutation, predict the complete
    mutant reactivity distribution for an unseen puzzle without mutant outcomes.
  endpoint_version: endpoint_v7_all_mutant_full_spectrum
  split_version: split_v4_lopo_puzzle
  evaluator_version: evaluator_v2_method_balanced_target_invariant
  primary_unit: puzzle
  development_puzzles: 20
  development_status: DEVELOPMENT_CONSUMED
  manuscript_default_route: BENCHMARK_MEASUREMENT_MAINLINE
  method_upgrade_policy: REQUIRES_INTERNAL_DUAL_GATE_AND_NEW_EXTERNAL_DUAL_GATE

authorization:
  allowed:
    - FREEZE_CURRENT_EVIDENCE_AND_RESULTS
    - ANALYZE_ALREADY_CONSUMED_DEVELOPMENT_OUTCOMES
    - COMPUTE_OUTCOME_BLIND_VIENNARNA_STRUCTURE_PRIORS
    - RUN_BOUNDED_DEVELOPMENT_MODEL_TRAINING_AFTER_M1_PASS
    - RUN_INTERNAL_NESTED_LOPO_AFTER_CANDIDATE_SCREEN
    - PREPARE_OUTCOME_BLIND_NEW_EXTERNAL_MANIFEST_AND_POWER
    - UPDATE_BENCHMARK_MANUSCRIPT_TO_MATCH_QUALIFIED_EVIDENCE
  prohibited:
    - ACCESS_NEW_EXTERNAL_OUTCOMES_BEFORE_M4_FINAL_MODEL_FROZEN
    - USE_HELD_TARGET_ERROR_OR_MASK_IN_PREDICTION
    - INTERFERE_WITH_UNRELATED_RUNNING_JOBS
    - START_OR_AUTHORIZE_WET_LAB_WORK
    - CLAIM_SOTA_WITHOUT_TASK_MATCHED_REPRODUCED_COMPARATORS
    - UPGRADE_DEVELOPMENT_PASS_TO_EXTERNAL_OR_MECHANISM_PASS
    - DELETE_OR_REWRITE_HISTORICAL_RESULTS

evidence_baseline:
  repository_branch: codex/reactflow-delta-model-rescue-v1-20260820
  predecessor_branch: codex/reactflow-delta-prospective-v2-20260813
  predecessor_head: bf45996ef74220de33ae2e41bdf4bdc1acb4c965
  p2_v3_result: /mnt/cunyuliu/prospective_v2_p2v3_sharded/p2_v3_scores_merged.json
  p2_v3_oof_root: /mnt/cunyuliu/prospective_v2_p2v3_sharded
  corrected_external_result: docs/prospective_v2/audit/p4_external_lrso_result_v1.json
  current_claim_ledger: docs/prospective_v2/model_rescue_decision_ledger_v1.yaml
  qualification:
    direct_crps_development: POST_HOC_DEVELOPMENT_PASS
    low_rank_increment: SMALL_BUT_SIGNIFICANT_DEVELOPMENT
    signed_delta_point_skill: CURRENT_NETWORK_DEVELOPMENT_PASS_VS_WT
    external_study_replication: NOT_ESTABLISHED
    mechanism: NOT_ESTABLISHED
    sota: NOT_ESTABLISHED

compute_budget:
  calendar_days: 14
  a100_gpu_days_max: 5.0
  single_gpu_sufficient: true
  unrelated_job_interference_allowed: false
  stop_when_either_budget_exhausted: true
  allocations:
    M1_FAILURE_DECOMPOSITION: 0.25
    M2_CANDIDATE_SCREEN: 1.25
    M3_INTERNAL_NESTED: 2.50
    M4_ABLATION_AND_FREEZE: 0.75
    M5_EXTERNAL_SCORING_RESERVE: 0.25

estimand:
  hierarchy:
    - position
    - mutant
    - cell
    - method_balanced_puzzle
    - puzzle_macro_mean
  prediction_before_scoring: true
  registered_full_output_required: true
  target_invariant_prediction_required: true
  held_target_access: SCORER_ONLY
  held_error_access: SCORER_ONLY
  held_target_mask_access: SCORER_ONLY

primary_metrics:
  rule: INTERSECTION_UNION_BOTH_MUST_PASS
  metrics:
    - id: full_construct_crps
      direction: lower_is_better
      aggregation: method_balanced_puzzle_macro
    - id: signed_delta_mae
      direction: lower_is_better
      aggregation: method_balanced_puzzle_macro
  secondary:
    - signed_delta_wmae
    - mutant_reactivity_mae
    - calibration_error
    - coverage_68
    - coverage_95
    - registered_prediction_coverage
    - failure_rate
    - design_region_effect
    - other_region_effect

m1_structure_probe:
  status: COMPLETED_STRUCTDELTA_EXCLUDED
  split: split_v4_lopo_puzzle
  inputs:
    sequence_only:
      - signed_sequence_distance
      - absolute_sequence_distance
      - edit_position
      - receiver_position
      - mutation_identity
      - receiver_region
    structure_additions:
      - viennarna_mfe_graph_distance
      - viennarna_ensemble_base_pair_probability
  targets:
    - signed_delta
    - absolute_delta
  learner: TRAIN_ONLY_STANDARDIZED_RIDGE_FIXED_ALPHA_1
  aggregation: method_balanced_puzzle_macro_mae
  eligibility_rule: >-
    Structure additions must have a paired 20-puzzle CI lower bound above zero
    on at least one target, improve at least 12 of 20 puzzles on that target,
    and worsen the other target by no more than 0.5 percent relative.
  positive_puzzles_min: 12
  max_other_target_relative_worsening: 0.005
  use_if_pass: STRUCT_DELTA_ENTERS_M2_SCREEN
  use_if_fail: STRUCT_DELTA_EXCLUDED_FROM_M2

m1_results:
  failure_atlas: docs/prospective_v2/audit/m1_failure_atlas_v1.json
  structure_probe: docs/prospective_v2/audit/m1_structure_probe_v1.json
  current_network_signed_delta_mae_gain_vs_wt: 0.012978322093460417
  low_rank_signed_delta_mae_gain_vs_rank0: 0.0007691653969666553
  low_rank_relative_delta_mae_gain_vs_rank0: 0.0031853
  low_rank_crps_gain_vs_rank0: 0.0017957060889348063
  low_rank_crps_mean_shapley: 0.0012259507867934502
  low_rank_crps_scale_shapley: 0.000569755302141356
  near_zero_low_rank_delta_mae_gain: -0.002745203301206897
  structure_signed_delta_gain: -0.0005727973750599136
  structure_signed_delta_ci95:
    - -0.0009795781219513596
    - -0.0001660166281684676
  structure_absolute_delta_gain: 0.00012419872083890837
  structure_absolute_delta_ci95:
    - -0.00039320947514082127
    - 0.000641606916818638
  m2_eligible_candidates:
    - B1_RFD_DIRECT_ALIGNED
    - L2_ALIGNED_FIXED_RANK2_CONTROL
    - SPARSE_DELTA_MDN
  excluded_candidate:
    - STRUCT_DELTA

controlled_models:
  B0:
    id: rfd_direct_rank0_current
    role: HISTORICAL_DEVELOPMENT_REFERENCE
  B1:
    id: rfd_direct_aligned
    role: CONTROLLED_REFERENCE
    requirements:
      - FOLD_LEGAL_INPUT_NORMALIZATION
      - DELTA_PARAMETERIZATION
      - TRAIN_EVAL_DISTRIBUTION_ALIGNMENT
      - METHOD_BALANCED_TRAINING
      - TRAIN_ONLY_CALIBRATION
  L2_ALIGNED:
    id: lrso_rank2_aligned
    role: FIXED_LOW_RANK_COMPARATOR
    rank: 2
    rank_search_allowed: false
  SPARSE_DELTA:
    id: sparse_delta_mdn
    role: UNCONDITIONAL_MODEL_RESCUE_CANDIDATE
    zero_component_mean: 0.0
    changer_labels_allowed: false
    outcome_threshold_allowed: false
    huber_lambda_candidates:
      - 0.0
      - 0.1
  STRUCT_DELTA:
    id: structure_aware_mutation_receiver
    role: CONDITIONAL_MODEL_RESCUE_CANDIDATE
    structure_source: VIENNARNA_WT_ENSEMBLE_BASE_PAIR_PROBABILITY
    pretrained_features_allowed: false
    message_passing_layers: 1
    mutation_receiver_cross_attention_layers: 1
    max_parameter_ratio_vs_B1: 1.25
  COMBINED:
    id: sparse_struct_delta
    role: CONDITIONAL_COMBINATION
    allowed_only_if_both_individual_candidates_screen_pass: true

m2_screen_protocol:
  status: COMPLETED_NO_RESCUE_CANDIDATE
  data: REAL_OPENKNOT_M2_V4_5_2
  synthetic_data_role: ENGINEERING_PIPELINE_TEST_ONLY_NEVER_SCIENTIFIC
  smoke_result: docs/prospective_v2/audit/m2_real_smoke_v1.json
  outer_folds: 20
  seed: 0
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0
  evaluator: evaluator_v2_method_balanced_target_invariant
  candidates:
    - b1_rfd_direct_aligned
    - l2_aligned_rank2
    - sparse_delta_mdn_h0
    - sparse_delta_mdn_h01
  screen_rule:
    comparator: b1_rfd_direct_aligned
    mean_crps_gain_nonnegative: true
    mean_signed_delta_mae_gain_nonnegative: true
    crps_positive_puzzles_min: 10
    signed_delta_mae_positive_puzzles_min: 10
    prediction_key_coverage_required: 1.0
    failure_rate_max: 0.0
  interpretation: >-
    M2 uses consumed development outer-fold results only to remove clearly failed
    families. It is not confirmation. M3 must perform all final family and
    hyperparameter selection inside each outer-train set.
  smoke_summary:
    l2_aligned_rank2:
      crps_gain_vs_b1: 0.006966094519399779
      signed_delta_mae_gain_vs_b1: 0.01321537411043694
    sparse_delta_mdn_h0:
      crps_gain_vs_b1: 0.025539264114680355
      signed_delta_mae_gain_vs_b1: 0.009889891118457894
    sparse_delta_mdn_h01:
      crps_gain_vs_b1: 0.01919806780345562
      signed_delta_mae_gain_vs_b1: 0.02697689297133543
  full_screen_result:
    qualification_artifact: docs/prospective_v2/audit/m2_qualification_v1.json
    raw_merged_directory: /mnt/cunyuliu/reactflow_delta_model_rescue_v1/m2_real_fullscreen_merged_20260820
    evidence_status: DEVELOPMENT_CONSUMED_SCREEN_NOT_CONFIRMATION
    overall_status: M2_NO_RESCUE_CANDIDATE
    l2_aligned_rank2:
      crps_gain_vs_b1: 0.0006994185901454438
      crps_positive_puzzles: 15
      signed_delta_mae_gain_vs_b1: -5.237811735690767e-06
      signed_delta_mae_positive_puzzles: 11
      status: M2_SCREEN_FAIL
    sparse_delta_mdn_h0:
      crps_gain_vs_b1: 0.009060097762432275
      crps_positive_puzzles: 20
      signed_delta_mae_gain_vs_b1: -0.00958523316499289
      signed_delta_mae_positive_puzzles: 6
      status: M2_SCREEN_FAIL
    sparse_delta_mdn_h01:
      crps_gain_vs_b1: 0.008865626446699481
      crps_positive_puzzles: 19
      signed_delta_mae_gain_vs_b1: -0.012405016288547495
      signed_delta_mae_positive_puzzles: 5
      status: M2_SCREEN_FAIL
    m3_eligible_families:
      - b1_rfd_direct_aligned
    stop_action: METHOD_RESCUE_FAIL_BENCHMARK_ROUTE_LOCKED

m3_nested_protocol:
  status: FROZEN_BEFORE_COMPLETE_M2_SCREEN_RESULT
  prerequisite: M2_SCREEN_PASS
  runner: scripts/reactflow_delta/run_model_rescue_m3_v1.py
  split: split_v4_lopo_puzzle
  outer_folds: 20
  inner_folds_per_outer: 4
  inner_selection_seed: 0
  inner_epochs: 10
  final_epochs: 40
  final_seeds: [0, 1, 2, 3, 4]
  learning_rate: 0.001
  weight_decay: 0.0
  family_source: M2_QUALIFICATION_ELIGIBLE_FAMILIES_ONLY
  sparse_lambda_policy: INNER_SELECT_0_OR_0_1_WITHIN_EACH_OUTER_TRAIN
  candidate_selection:
    score: 0.5*(candidate_crps/B1_crps)+0.5*(candidate_delta_mae/B1_delta_mae)
    feasibility: NEITHER_PRIMARY_WORSE_THAN_B1
    tie_breaker: FEWER_PARAMETERS_THEN_STABLE_ID
  comparator_selection:
    eligible: [b1_rfd_direct_aligned, l2_aligned_rank2_if_m2_eligible]
    location: OUTER_TRAIN_INNER_FOLDS_ONLY
    rule: LOWEST_FEASIBLE_AGGREGATE_INNER_SCORE
  outer_held_access:
    family_selection: false
    lambda_selection: false
    comparator_selection: false
    epoch_selection: false
    scoring_after_freeze: true
  deployment_distribution: EQUAL_WEIGHT_FIVE_SEED_GAUSSIAN_COMPONENT_MIXTURE
  oof_artifact: PREDICTION_ONLY_NO_TARGET
  evidence_status: POST_HOC_DEVELOPMENT_NESTED

selection:
  outer_held_used_for_selection: false
  candidate_selection_location: OUTER_TRAIN_INNER_FOLDS_ONLY
  inner_score: 0.5*(candidate_crps/B1_crps)+0.5*(candidate_delta_mae/B1_delta_mae)
  feasibility_constraint: NEITHER_PRIMARY_METRIC_WORSE_THAN_B1
  tie_breakers:
    - INNER_SELECTION_FREQUENCY
    - LOWER_AGGREGATE_INNER_SCORE
    - FEWER_PARAMETERS
  seed_policy:
    screening_seeds:
      - 0
    formal_seeds:
      - 0
      - 1
      - 2
      - 3
      - 4

internal_success_gate:
  comparator: STRONGEST_ELIGIBLE_OF_B1_AND_L2_ALIGNED
  crps:
    paired_ci_low_gt_zero: true
    minimum_absolute_gain: 0.003
    minimum_relative_gain: 0.02
    practical_rule: MAX_OF_ABSOLUTE_AND_RELATIVE
  signed_delta_mae:
    paired_ci_low_gt_zero: true
    minimum_relative_gain: 0.02
    must_also_beat_wt_anchor: true
  robustness:
    crps_positive_puzzles_min: 14
    delta_mae_positive_puzzles_min: 12
    leave_one_puzzle_effect_positive: true
    max_single_puzzle_total_effect_fraction: 0.25
  engineering:
    registered_prediction_coverage_min: 0.995
    failure_rate_max: 0.0
    max_coverage_error_worsening_percentage_points: 2.0
  fail_status: METHOD_RESCUE_FAIL

structure_probe_gate:
  comparator: SEQUENCE_DISTANCE_MATCHED_DIRECT_PROBE
  improve_at_least_one_primary: true
  other_primary_max_relative_worsening: 0.01
  directionally_positive_puzzles_min: 12
  fail_action: SKIP_STRUCT_DELTA

new_external_gate:
  existing_consumed_external_excluded_from_primary: true
  joint_independent_units_min: 9
  study_or_publication_lineages_min: 3
  max_single_lineage_fraction: 0.50
  model_and_calibrator_frozen_before_outcome_access: true
  external_finetuning_allowed: false
  outcome_based_recalibration_allowed: false
  crps_cluster_ci_low_gt_zero: true
  signed_delta_mae_cluster_ci_low_gt_zero: true
  minimum_relative_gain_each_primary: 0.02
  leave_one_lineage_out_nonnegative: true
  underpowered_status: EXPLORATORY_EXTERNAL_ONLY

phase_graph:
  - id: M0
    name: EVIDENCE_AND_AUTHORITY_FREEZE
    training_allowed: false
    new_external_outcome_access_allowed: false
    next_on_pass: M1
    next_on_fail: STOP_PRESERVE_EVIDENCE
  - id: M1
    name: FAILURE_DECOMPOSITION_AND_STRUCTURE_PROBE
    training_allowed: DIAGNOSTIC_ONLY
    new_external_outcome_access_allowed: false
    next_on_pass: M2
    next_on_fail: BENCHMARK_ROUTE_LOCKED
  - id: M2
    name: CANDIDATE_SCREEN
    training_allowed: true
    new_external_outcome_access_allowed: false
    next_on_pass: M3
    next_on_fail: METHOD_RESCUE_FAIL
  - id: M3
    name: INTERNAL_NESTED_DEVELOPMENT
    training_allowed: true
    new_external_outcome_access_allowed: false
    next_on_pass: M4
    next_on_fail: BENCHMARK_ROUTE_LOCKED
  - id: M4
    name: ABLATION_AND_FINAL_MODEL_FREEZE
    training_allowed: true
    new_external_outcome_access_allowed: false
    next_on_pass: M5
    next_on_fail: BENCHMARK_ROUTE_LOCKED
  - id: M5
    name: SEALED_NEW_EXTERNAL_EVALUATION
    training_allowed: false
    new_external_outcome_access_allowed: REQUIRES_ELIGIBILITY_AND_FINAL_FREEZE
    next_on_pass: M6_METHOD_AUGMENTED_BENCHMARK
    next_on_fail: M6_BENCHMARK_ONLY
  - id: M6
    name: MANUSCRIPT_REQUALIFICATION
    training_allowed: false
    new_external_outcome_access_allowed: false
    next_on_pass: COMPLETE
    next_on_fail: PUBLICATION_NOT_READY

automatic_stop_rules:
  - INTERNAL_DUAL_PRIMARY_GATE_FAILS
  - COMPUTE_BUDGET_EXHAUSTED
  - CALENDAR_BUDGET_EXHAUSTED
  - PREDICTION_DEPENDS_ON_HELD_TARGET_OR_TARGET_MASK
  - IMPROVEMENT_EXISTS_ONLY_AFTER_SEED_SCALE_RANK_OR_PUZZLE_SELECTION
  - NEW_EXTERNAL_JOINT_UNIT_COUNT_BELOW_NINE_FOR_CONFIRMATORY_CLAIM

claim_policy:
  low_rank_headline_requires: INTERNAL_AND_NEW_EXTERNAL_DUAL_PASS_PLUS_SOURCE_CONTROL
  method_headline_requires: INTERNAL_AND_NEW_EXTERNAL_DUAL_PASS
  mechanism_headline_requires: SEPARATE_PROSPECTIVE_MECHANISM_CONTRACT
  sota_headline_requires: TASK_MATCHED_REPRODUCED_COMPARATOR_CLOSURE
  default_if_any_required_evidence_missing: BENCHMARK_ROUTE_LOCKED
