scientific_scope:
  task: ENDPOINT_V7_ALL_MUTANT_FULL_CONSTRUCT_SIGNED_DELTA_DISTRIBUTION
  data: REAL_OPENKNOT_M2_V4_5_2
  data_path: /mnt/cunyuliu/reactflow_delta_artifacts_20260729/reactflow_delta/openknot_m2/OK7a_M2_data.v4.5.2.csv
  development_status: DEVELOPMENT_CONSUMED
  split: SPLIT_V4_TWENTY_FOLD_LOPO_PUZZLE
  evaluator: EVALUATOR_V2_METHOD_BALANCED_TARGET_INVARIANT
  primary_metrics: [FULL_CONSTRUCT_CRPS, SIGNED_DELTA_MAE]
  baseline: corrected_b1
  primary_candidate: b1_exact_ensemble_delta_residual

hypothesis:
  confirmed_v4_observation: >-
    A 35M-45M mutation-conditioned dual tower with paired RNA-FM was statistically
    equivalent to corrected B1; capacity and foundation controls show that extra
    representation alone did not produce a task-level gain.
  missing_capability: >-
    V4 never explicitly computed the change in the WT versus exact-mutant
    Boltzmann structural ensemble. Its pair field was WT-conditioned and learned
    from only nineteen outer-train puzzles.
  prediction: >-
    Exact-mutant minus WT ensemble features should explain a train-only-learned,
    cross-puzzle component of signed 2A3 reactivity residuals that WT-only
    structure, sequence distance, capacity, and foundation embeddings do not.
  falsifier: >-
    The complete twenty-fold fixed linear eligibility probe fails its signed-delta
    gate, or the later residual candidate cannot improve both point and
    probabilistic metrics over corrected B1.

structure_engine:
  package: ViennaRNA
  algorithm: GLOBAL_MCCASKILL_PARTITION_FUNCTION
  temperature_celsius: 37.0
  sequence_length: 177
  sequence_normalization: T_TO_U
  hard_constraints: NONE
  soft_constraints: NONE
  outcome_columns_allowed: false
  wt_and_exact_mutant_required: true
  cache_features:
    - DELTA_UNPAIRED_PROBABILITY
    - DELTA_PAIRING_ENTROPY
    - DELTA_SOURCE_RECEIVER_PAIR_PROBABILITY
    - WT_SOURCE_RECEIVER_PAIR_PROBABILITY
    - MUTANT_SOURCE_RECEIVER_PAIR_PROBABILITY
    - RECEIVER_BPP_ROW_L1_CHANGE
    - RECEIVER_BPP_ROW_L2_CHANGE
    - DELTA_UPSTREAM_PAIRING_MASS
    - DELTA_DOWNSTREAM_PAIRING_MASS
    - GLOBAL_BPP_FROBENIUS_CHANGE
    - ENSEMBLE_FREE_ENERGY_CHANGE
    - SOURCE_UNPAIRED_PROBABILITY_CHANGE

eligibility_probe:
  phase: V5M2
  learner: TRAIN_ONLY_WEIGHTED_STANDARDIZED_RIDGE_ALPHA_ONE
  targets: [SIGNED_DELTA, ABSOLUTE_DELTA]
  weighting: EQUAL_PUZZLE_METHOD_THEN_EQUAL_MUTANT_THEN_EQUAL_QUALIFIED_POSITION
  baseline_features:
    - SIGNED_SEQUENCE_DISTANCE
    - ABSOLUTE_SEQUENCE_DISTANCE
    - LOG_ABSOLUTE_SEQUENCE_DISTANCE
    - EDIT_POSITION
    - RECEIVER_POSITION
    - SAME_SITE
    - RECEIVER_DESIGN_REGION
    - MUTATION_REF_ONE_HOT
    - MUTATION_ALT_ONE_HOT
    - WT_REACTIVITY
    - WT_REACTIVITY_ERROR
    - WT_OBSERVED
  candidate_features: BASELINE_PLUS_ALL_FIXED_EXACT_ENSEMBLE_DELTA_FEATURES
  complete_before_score_access: true
  gate:
    signed_delta_relative_mae_gain_min: 0.01
    signed_delta_paired_ci_lower_gt: 0.0
    signed_delta_positive_puzzles_min: 14
    absolute_delta_relative_mae_guardrail_min: -0.005
    registered_prediction_coverage: 1.0
    failure_rate: 0.0
    unexpected_keys: 0

candidate_model:
  phase: V5M3_AND_V5M4
  id: b1_exact_ensemble_delta_residual
  base: corrected_b1
  base_training: IDENTICAL_TO_CORRECTED_B1_THEN_FROZEN
  residual_input: DETACHED_B1_SOURCE_RECEIVER_FEATURES_PLUS_FIXED_ENSEMBLE_DELTA_FEATURES
  residual_head: LINEAR_GELU_LINEAR_HIDDEN_64_ZERO_INITIALIZED_OUTPUT
  residual_training_loss: EXACT_METHOD_BALANCED_SIGNED_DELTA_L1
  residual_epochs: 40
  residual_optimizer: ADAM
  residual_learning_rate: 0.001
  residual_weight_decay: 0.001
  residual_gradient_clip: 5.0
  calibration: FROZEN_MEAN_ZERO_MEAN_TWO_GAUSSIAN_CRPS
  disallowed:
    - FOUNDATION_MODEL_CHANGE
    - BACKBONE_CAPACITY_CHANGE
    - RANK_SEARCH
    - STRUCTURE_ENGINE_SEARCH
    - FEATURE_SUBSET_SEARCH
    - LOSS_WEIGHT_SEARCH
    - EPOCH_SEARCH
    - SEED_SUBSET_SELECTION

development_gate:
  phase: V5M4
  seed: 0
  outer_folds: 20
  complete_before_score_access: true
  versus_corrected_b1:
    crps_relative_gain_min: 0.05
    signed_delta_mae_relative_gain_min: 0.05
    crps_paired_ci_lower_gt: 0.0
    signed_delta_mae_paired_ci_lower_gt: 0.0
    crps_positive_puzzles_min: 16
    signed_delta_mae_positive_puzzles_min: 16
    leave_one_puzzle_effect_positive: true
    max_single_puzzle_effect_fraction: 0.20
  prediction_coverage: 1.0
  failure_rate: 0.0
  unexpected_keys: 0
  max_coverage_error_worsening_pp: 1.0

formal_confirmation:
